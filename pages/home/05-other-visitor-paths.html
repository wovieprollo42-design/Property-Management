<!--
  HOME · 05 OTHER VISITOR PATHS (renters and guests)
  Background: #F8F5EC ivory (data-bg="ivory")
  Layout: short text on the left; two large link rows on the right, separated by hairlines.
          Deliberately quieter than the owner sections above.
  No photo in this section.
-->
<section class="pmp pmp-sec" id="pmp-home-other-visitor-paths" data-bg="ivory" aria-labelledby="pmp-home-other-visitor-paths-title">
  <div class="pmp-wrap">
    <div class="pmp-home-paths__grid">
      <div>
        <p class="pmp-eyebrow">For renters and guests</p>
        <h2 id="pmp-home-other-visitor-paths-title">Looking for a home or a getaway?</h2>
        <p class="pmp-home-paths__text">Browse our current long-term rentals or explore vacation properties through their approved booking pages.</p>
      </div>

      <ul class="pmp-home-paths__links">
        <li>
          <a class="pmp-home-paths__link" href="/available-rentals">
            <span class="pmp-home-paths__meta">Long-term rentals</span>
            <span class="pmp-home-paths__label">View Available Rentals</span>
            {{arrow}}
          </a>
        </li>
        <li>
          <a class="pmp-home-paths__link" href="/vacation-rentals">
            <span class="pmp-home-paths__meta">Vacation properties</span>
            <span class="pmp-home-paths__label">Explore Vacation Rentals</span>
            {{arrow}}
          </a>
        </li>
      </ul>
    </div>
  </div>
</section>

<style>
#pmp-home-other-visitor-paths .pmp-home-paths__grid {
  display: grid;
  gap: 32px;
  align-items: end;
}

#pmp-home-other-visitor-paths .pmp-home-paths__text {
  max-width: 30em;
  margin-top: 16px;
}

#pmp-home-other-visitor-paths .pmp-home-paths__links {
  border-top: 1px solid var(--pmp-line-strong);
}

#pmp-home-other-visitor-paths .pmp-home-paths__links li {
  border-bottom: 1px solid var(--pmp-line-strong);
}

#pmp-home-other-visitor-paths .pmp-home-paths__link {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    "meta arrow"
    "label arrow";
  align-items: center;
  column-gap: 16px;
  padding: 20px 4px 22px 0;
  text-decoration: none;
  color: var(--pmp-navy);
}

#pmp-home-other-visitor-paths .pmp-home-paths__meta {
  grid-area: meta;
  font-size: 14px;
  color: var(--pmp-slate);
}

#pmp-home-other-visitor-paths .pmp-home-paths__label {
  grid-area: label;
  font-family: var(--pmp-font-head);
  font-size: clamp(20px, calc(17px + 0.8vw), 26px);
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: -0.015em;
  text-decoration: underline;
  text-decoration-color: transparent;
  text-decoration-thickness: 2px;
  text-underline-offset: 6px;
  transition: text-decoration-color var(--pmp-dur) var(--pmp-ease);
}

#pmp-home-other-visitor-paths .pmp-home-paths__link svg {
  grid-area: arrow;
  width: 20px;
  height: 20px;
  color: var(--pmp-bronze);
  transition: transform var(--pmp-dur) var(--pmp-ease);
}

#pmp-home-other-visitor-paths .pmp-home-paths__link:hover .pmp-home-paths__label {
  text-decoration-color: var(--pmp-gold);
}

#pmp-home-other-visitor-paths .pmp-home-paths__link:hover svg {
  transform: translateX(4px);
}

@media (min-width: 900px) {
  #pmp-home-other-visitor-paths .pmp-home-paths__grid {
    grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    gap: clamp(40px, 8vw, 120px);
  }
}
</style>
