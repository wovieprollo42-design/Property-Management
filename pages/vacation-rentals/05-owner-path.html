<!--
  VACATION RENTALS · 05 OWNER PATH
  Background: #FFFFFF white (data-bg="paper")
  Layout: a photo, then the owner message and the button to the short-term management page.
  Photo slot: vacation-owner · source 1200 x 900 px · ratio 4:3 (an approved vacation property exterior)
-->
<section class="pmp pmp-sec" id="pmp-vacation-owner-path" data-bg="paper" aria-labelledby="pmp-vacation-owner-path-title">
  <div class="pmp-wrap">
    <div class="pmp-vacation-owner__row">
      <div class="pmp-vacation-owner__media pmp-marks">
        <div class="pmp-ph pmp-ph--4x3" data-photo-slot="vacation-owner">
          <p class="pmp-ph__label">
            <span class="pmp-ph__tag">INSERT PHOTO</span>
            <span class="pmp-ph__desc">Exterior of an approved vacation property in its setting.</span>
            <span class="pmp-ph__spec">Source 1200 × 900 px · Display ratio 4:3 · Crop: the home centered.</span>
          </p>
        </div>
      </div>
      <div class="pmp-vacation-owner__copy">
        <p class="pmp-ribbon">For owners</p>
        <h2 id="pmp-vacation-owner-path-title">Own a vacation rental?</h2>
        <p class="pmp-vacation-owner__text">Learn about our short-term rental management services.</p>
      </div>
      <a class="pmp-btn pmp-btn--primary" href="/short-term-rental-management">Explore Short-Term Management {{arrow}}</a>
    </div>
  </div>
</section>

<style>
#pmp-vacation-owner-path {
  padding-block: clamp(40px, calc(28px + 2.4vw), 64px);
  border-top: 1px solid var(--pmp-line);
}

#pmp-vacation-owner-path .pmp-vacation-owner__row {
  display: grid;
  gap: 28px;
  align-items: center;
}

#pmp-vacation-owner-path .pmp-vacation-owner__media {
  width: min(100%, 420px);
}

#pmp-vacation-owner-path h2 {
  font-size: clamp(28px, calc(21px + 1.8vw), 40px);
}

@media (min-width: 900px) {
  #pmp-vacation-owner-path .pmp-vacation-owner__row {
    grid-template-columns: minmax(0, 5fr) minmax(0, 5fr) auto;
    gap: clamp(32px, 5vw, 72px);
  }
}

#pmp-vacation-owner-path .pmp-vacation-owner__text {
  margin-top: 10px;
}
</style>
